<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#172120" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="지비스">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>지비스</title>
<style>
/* ── 색 ────────────────────────────────────────────────────
   진호알리미·혜원이지의 «고스트» 를 그대로 가져왔다. 폰에서도 같은 집이어야 한다.
   어두운 화면을 쓰는 분을 위해 밤 색도 같이 둔다. */
:root{
  --bg:#FAFAF9; --fg:#1C1917; --accent:#C1121F; --on:#FFFFFF;
  --card:#FFFFFF; --card2:#F3EFEE; --line:#E8E5E3; --dim:#6A625C; --fg2:#44403C;
  --ok:#0E7C58; --warn:#B3541E;
  --soft:#FCE9EA; --bar:#FFFFFF; --cb:#EFECEA; --rad:20px; --sh:0 1px 2px rgba(40,20,10,.05),0 6px 18px rgba(40,20,10,.05);
  --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,sans-serif;
  --pad:16px;
}
/* 폰이 다크 모드일 때만 — 다크 + 민트 */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1413; --fg:#EAF2F0; --accent:#5EEAD4; --on:#0E1413;
    --card:#172120; --card2:#12302D; --line:#26332F; --dim:#9FB3AE; --fg2:#CFE0DC;
    --ok:#4FD1A0; --warn:#FFB27A;
    --soft:#12302D; --bar:#172120; --cb:#26332F; --rad:16px; --sh:none;
    --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,sans-serif;
  }
}
:root[data-theme="dark"]{
    --bg:#0E1413; --fg:#EAF2F0; --accent:#5EEAD4; --on:#0E1413;
    --card:#172120; --card2:#12302D; --line:#26332F; --dim:#9FB3AE; --fg2:#CFE0DC;
    --ok:#4FD1A0; --warn:#FFB27A;
    --soft:#12302D; --bar:#172120; --cb:#26332F; --rad:16px; --sh:none;
    --font:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:var(--font);
  font-size:15px; line-height:1.5;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.themeb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--fg);font-size:12.5px;font-weight:700;cursor:pointer}
.themeb.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.themeb i{display:flex;width:100%;height:38px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.themeb i b{flex:1}
.attdel{all:unset;box-sizing:border-box;margin-left:auto;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);cursor:pointer}

/* ── 머리 ─────────────────────────────────────────────── */
.top{
  position:sticky; top:0; z-index:9; background:var(--bar);
  display:flex; align-items:center; gap:10px;
  padding:14px var(--pad) 10px; border-bottom:1px solid var(--line);
}
.top .logo{width:32px;height:32px;flex:none;object-fit:contain;margin-right:-2px}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.4px;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .back{
  background:none;border:0;padding:6px 8px 6px 0;font-size:20px;line-height:1;cursor:pointer;color:var(--accent);
}
.top .act{
  background:var(--soft);border:0;border-radius:999px;
  padding:0 16px;height:36px;font-size:14px;font-weight:600;color:var(--accent);cursor:pointer;
}
.wrap{padding:12px var(--pad) calc(92px + env(safe-area-inset-bottom))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;
  background:var(--bar);border-top:1px solid var(--line);
  padding:6px 2px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:0;padding:5px 0;color:var(--dim);font-size:clamp(8.5px,2.5vw,10px);font-weight:700;
  letter-spacing:-.4px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav button .li{width:22px;height:22px;display:block;box-sizing:content-box;padding:4px clamp(4px,1.7vw,13px);border-radius:999px}
.nav button.on{color:var(--accent)}
.nav button.on .li{background:var(--soft)}
.nav button span{white-space:nowrap}
.wkdesc{font-size:12.5px;color:var(--dim);margin:0 2px 10px;line-height:1.55}.wkdesc b{color:var(--fg)}
.wkweeks{max-height:132px;overflow-y:auto;margin-bottom:10px;padding:2px}
/* 문자 문구 (v1.7.0) */
.tplb{all:unset;display:flex;width:100%;justify-content:space-between;align-items:center;cursor:pointer;font-weight:800}
.tpl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px}
.tplb span{font-size:10.5px;padding:2px 9px;border-radius:999px;background:var(--accent);color:var(--on);margin-left:8px}
.tplb span.s{background:var(--card2);color:var(--fg)}
.tpl p{margin:6px 0 0;font-size:12.5px;line-height:1.55;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tplact{display:flex;gap:6px;margin-top:8px}.tplact .btn{flex:1}
.ask{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--warn) 12%,var(--bg));font-size:13px;font-weight:700}
.smsrow{padding:0;align-items:stretch;flex-wrap:wrap}
.smsedit{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;gap:10px;padding:10px 12px;cursor:pointer;align-items:center}
.smsedit .att-tags{margin:0 0 0 auto}
.callbtns{display:flex;gap:6px;padding:0 10px 0 0;align-items:center}
.callbtn{display:inline-flex;align-items:center;gap:4px;padding:8px 11px;border-radius:999px;background:var(--ok);color:var(--on);font-weight:800;font-size:12px;text-decoration:none}
.callbtn .li{width:15px;height:15px;stroke:var(--on)}
.callnow{display:inline-flex;align-items:center;gap:6px;margin-top:8px;text-decoration:none;color:var(--ok)}
.btn .li{width:18px;height:18px;display:inline-block;vertical-align:-4px;margin-right:4px}
.btn.sm .li{margin-right:0}
.shbtn{flex:none;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;text-decoration:none}
.shbtn img{width:26px;height:26px;display:block}
.shbtn.off{opacity:.45}
.seg2 .shbtn{margin-left:6px}
.whatsnew{margin:0 0 12px;padding:12px 14px;border-radius:calc(var(--rad) - 4px);background:var(--soft);border:1px solid var(--cb)}
.wnh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wnh b{font-size:14px;color:var(--accent)}
.wnx{border:0;border-radius:999px;background:var(--accent);color:var(--on);padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
.wnv{margin:8px 0 2px;font-size:12px;font-weight:700;color:var(--dim)}
.whatsnew ul{margin:0;padding-left:18px;font-size:13px;line-height:1.55}
.phrc{display:inline-flex;align-items:center;gap:4px;padding:6px 6px 6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px}
.phrx{all:unset;cursor:pointer;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--warn);font-size:12px}
.att-lab small{font-weight:600;color:var(--dim);margin-left:4px}
.linkbtn{all:unset;color:var(--accent);font-weight:800;text-decoration:underline;cursor:pointer}
.tagbox{margin:10px 0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--accent) 8%,var(--bg));border:1px dashed var(--line);font-size:13px;line-height:1.6}
.tagbox .tgt{font-weight:800;color:var(--accent)}.tagbox .tgok{margin:6px 0;font-weight:700;color:var(--ok)}.tagbox .btn{margin-top:6px}
.tagexp{margin:2px 0 4px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--accent) 8%,var(--bg));font-size:12px;line-height:1.55;color:var(--fg2)}
.pv{white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;padding:12px 13px;border-radius:12px;background:#fff;border:1px solid var(--line);color:#222;font-size:14.5px;line-height:1.65;min-height:90px}
.dirty{color:var(--warn);font-weight:800;font-size:11px;margin-left:6px}
.chip.addtag{border-style:dashed;color:var(--accent)}
.note2{font-size:11.5px;color:var(--dim);margin:8px 2px 0;line-height:1.55}
.chip.nonum{opacity:.55;border-style:dashed}
.smsrow{width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit;align-items:center}
.smsrow .att-tags{margin:0;margin-left:auto}
textarea.fld{resize:vertical;line-height:1.55;font-size:15px}
.btn.send{background:var(--ok);color:var(--on);flex:1}
/* 급식 여중·여고 · 출결 (v1.6.0) */
.meal .sblk{margin-top:8px}.meal .sblk:first-of-type{margin-top:4px}
.meal .sch{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.meal .sch b{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent);color:var(--on)}
.meal .sblk + .sblk .sch b{background:var(--card2);color:var(--fg)}
.meal .sch em{font-style:normal;font-size:11.5px;color:var(--dim)}.meal .sch .bad{color:var(--warn)}
.meal .none1{font-size:12.5px}
.att-no{text-align:center;padding:26px 16px}
.att-no h3{margin:8px 0 6px;font-size:18px}
.att-no-ic .li{width:44px;height:44px;color:var(--dim);margin:0 auto;display:block}
.att-me{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.att-me small{width:100%;color:var(--dim);font-size:12.5px}
.chipx{font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--on)}
.att-new{margin-bottom:12px}
.att-form h2 small{font-weight:700;color:var(--accent);margin-left:6px}
.att-lab{font-size:12px;font-weight:800;color:var(--dim);margin:10px 0 5px}
.att-stu{max-height:210px;overflow-y:auto}
.att-conf{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.att-conf div{display:flex;gap:10px;font-size:14px}.att-conf span{width:42px;color:var(--dim);flex:none}
.att-ok{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-radius:12px;margin-bottom:10px;background:color-mix(in srgb,var(--ok) 14%,var(--bg));color:var(--ok);font-weight:700;font-size:13.5px}
.att-ok .btn{align-self:flex-start;color:var(--fg)}
.att-sum{font-weight:800;color:var(--dim);font-size:13px;margin:2px 2px 8px}
.att-day{font-weight:800;font-size:13px;margin:12px 2px 6px;color:var(--fg2)}
.att-row{display:flex;gap:10px;padding:10px 12px;margin-bottom:6px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.att-who{display:flex;flex-direction:column;min-width:54px}.att-who b{font-size:14px}.att-who small{color:var(--dim);font-size:11px}
.att-body{flex:1;min-width:0;font-size:13.5px}
.att-type{font-weight:800;padding:1px 8px;border-radius:999px;font-size:12px;background:var(--card2)}
.att-type.ill{background:color-mix(in srgb,var(--warn) 18%,var(--bg));color:var(--warn)}
.att-type.rec{background:color-mix(in srgb,var(--ok) 16%,var(--bg));color:var(--ok)}
.att-rs{margin-top:3px;color:var(--fg2);word-break:keep-all;overflow-wrap:anywhere}
.att-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.tg{font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;background:var(--card2);color:var(--dim)}
.tg.ok{background:color-mix(in srgb,var(--ok) 16%,var(--bg));color:var(--ok)}
.atwarn{margin:8px 0;padding:8px 12px;border-radius:10px;background:color-mix(in srgb,var(--warn) 14%,var(--bg));color:var(--warn);font-weight:700;font-size:13px}
/* 시간표·급식 보강 (v1.5.0) */
.seg2{display:flex;gap:6px;margin-bottom:10px}
.seg2 .chip{flex:1;text-align:center;padding:10px 0;font-weight:800}
table.tt.cl{min-width:0;width:100%;table-layout:fixed}
table.tt.cl th:first-child{width:38px}
table.tt.cl td,table.tt.cl th{padding:4px 2px}
table.tt.cl td b{display:block;font-size:11.5px;word-break:keep-all}
table.tt.cl td u{display:block;text-decoration:none;font-size:10px;color:var(--dim);margin-top:1px}
.mlsbox{border:2px solid var(--accent);border-radius:16px;padding:12px;margin-bottom:12px;background:var(--card)}
.mlsbt{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:800;margin-bottom:8px}
.mlsbt .li{width:18px;height:18px;display:block}
.mlsbt small{color:var(--dim);font-weight:600;font-size:11px}
.mlrow{display:flex;gap:6px}.mlrow .fld{flex:1;min-width:0}
.btn.sm{padding:10px 14px;font-size:13px;width:auto;flex:none}
.mlnav{display:flex;gap:6px;margin-bottom:8px}.mlnav .btn{flex:1}
.mlnav .btn.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.mldate{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;flex:1}
.mldate input{flex:1;min-width:0;padding:9px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}
.mlweek{font-weight:800;color:var(--dim);margin:6px 2px 8px;font-size:13px}
.mlfind{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg);font-size:13.5px;line-height:1.7}
.mlfind.bad{color:var(--warn)}.mlfind .nm{color:var(--accent)}
.mlgos{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mlgo.past{opacity:.5}.mlgo small{opacity:.7;margin-left:2px}.mlgo i{font-style:normal;opacity:.8}.mlgo u{text-decoration:none;font-weight:800}
.meal.today{border-color:var(--accent);border-width:2px}
.meal.focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.meal.none .muted{font-size:13px}
.meal .duty{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);font-size:12.5px;color:var(--dim)}
.meal .duty b{color:var(--accent)}
.nav button.navb{flex:.78}
.nav button:disabled{opacity:.3;cursor:default}
.nav button span{white-space:nowrap}
.nav button.on span{font-weight:800}

/* ── 오늘 띠 ──────────────────────────────────────────── */
.dayline{
  display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  margin-bottom:14px;
}
.dayline b{font-size:22px;font-weight:800;letter-spacing:-.6px}
.dayline span{font-size:13px;color:var(--dim)}
.dayline em{
  font-style:normal;font-size:12px;font-weight:800;color:var(--on);background:var(--accent);
  border-radius:999px;padding:2px 9px;
}

/* ── 타일 격자 (고르신 시안) ───────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{
  display:grid;grid-template-columns:34px 1fr;grid-template-areas:"ic tt" "td td";column-gap:10px;row-gap:7px;align-items:center;text-align:left;
  background:var(--card);border:1px solid var(--cb);border-radius:var(--rad);box-shadow:var(--sh);
  padding:12px 13px 13px;cursor:pointer;min-height:0;
  transition:transform .08s,border-color .12s;
}
.tile:active{transform:scale(.975)}
.tile.wide{grid-column:1/-1}
.tile .ic{grid-area:ic;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--soft);line-height:1;color:var(--accent)}
.tile .ic .li{width:20px;height:20px;display:block}
.tile .tt{grid-area:tt;font-size:15px;font-weight:700;letter-spacing:-.3px;min-width:0}
.tile .td{grid-area:td;font-size:12.5px;color:var(--dim);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.tile .td b{color:var(--fg);font-weight:700}
.tile.none{opacity:.55}

/* ── 목록·카드 ───────────────────────────────────────── */
.card{
  background:var(--card);border:1px solid var(--cb);border-radius:calc(var(--rad) - 4px);box-shadow:var(--sh);
  padding:14px 15px;margin-bottom:12px;
}
.card h2{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--dim);letter-spacing:.2px}
.row{display:flex;gap:9px;align-items:baseline;padding:6px 0}
.row+.row{border-top:1px solid var(--line)}
.row i{font-style:normal;font-size:12px;font-weight:800;color:var(--accent);flex:0 0 auto;min-width:38px}
.row b{font-weight:800;flex:0 0 auto}
.row span{color:var(--fg2);min-width:0;font-size:14px}
.muted{color:var(--dim);font-size:13.5px}
.empty{text-align:center;color:var(--dim);padding:34px 10px;font-size:14px;line-height:1.7}

/* ── 시간표 표 ───────────────────────────────────────── */
.tt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tt{border-collapse:collapse;width:100%;min-width:330px;font-size:12px}
table.tt th,table.tt td{
  border:1px solid var(--line);padding:5px 3px;text-align:center;vertical-align:middle;
}
table.tt th{background:var(--card2);font-weight:800;font-size:11.5px;color:var(--fg2)}
table.tt td{height:44px}
table.tt td.on{background:var(--card)}
table.tt td b{display:block;font-size:12.5px;font-weight:800}
table.tt td u{display:block;text-decoration:none;font-size:10.5px;color:var(--dim);margin-top:1px}
table.tt col.today,table.tt th.today{background:color-mix(in srgb,var(--accent) 16%,transparent)}
table.tt td.today{background:color-mix(in srgb,var(--accent) 9%,var(--card))}

/* ── 급식 ────────────────────────────────────────────── */
.meal .day{font-size:13px;font-weight:800;color:var(--dim);margin-bottom:5px}
.meal .day em{font-style:normal;font-weight:700;margin-left:7px;opacity:.75}
.meal .dishes{display:flex;flex-wrap:wrap;gap:5px 12px}
.meal .dishes span{font-size:14.5px;font-weight:600}

/* ── 주간업무 ────────────────────────────────────────── */
.dept{margin-bottom:12px}
.dept>h3{
  margin:0 0 6px;font-size:14px;font-weight:800;color:var(--fg);
  background:color-mix(in srgb,var(--accent) 11%,transparent);
  border-radius:8px;padding:5px 10px;
}
.dept p{margin:0;font-size:14px;line-height:1.7;color:var(--fg2);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.dept p.c{text-align:center}
.dept p.r{text-align:right}
.dept a{color:var(--accent);font-weight:700}
/* 번호·기호는 따로 떼어 «내어쓰기» — 줄이 넘어가도 글자가 기호 밑으로 안 파고든다 */
.dept p.li{display:flex;gap:6px;margin-top:3px}
.dept p.li .mk{flex:none;min-width:1.5em;font-weight:700;color:var(--fg)}
.dept p.li .tx{flex:1;min-width:0}
.dept p.l0{margin-top:14px;font-weight:700;color:var(--fg)}
.dept p.l0:first-of-type{margin-top:4px}
.dept p.l1{margin-left:12px}
.dept p.l2{margin-left:26px;font-size:13.5px}
.dept p.l3{margin-left:40px;font-size:13px;color:var(--dim)}
.dept p.sp{height:6px}
/* 표 — ★ 칸 안 글은 «원래 줄바꿈이 있는 곳» 에서만 줄을 바꾼다(white-space:pre). 자동으로 꺾지 않고, 넓으면 표를 좌우로 밀어 본다 */
.dept .tbw{overflow-x:auto;margin:8px 0;border-radius:8px;border:1px solid var(--line);-webkit-overflow-scrolling:touch}

.dept table td:last-child{border-right:0}
.dept table td.nw{text-align:center;vertical-align:middle}
.dept table td.hd{background:var(--card2);color:var(--fg);font-weight:800;text-align:center;vertical-align:middle}

.dept table td p{font-size:12.5px;line-height:1.55;margin:0;white-space:pre;word-break:normal;overflow-wrap:normal}

/* ── 바로가기 타일 ───────────────────────────────────── */
.links{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.lnk{
  display:flex;flex-direction:column;gap:4px;text-align:left;
  background:var(--bg);border:1px solid var(--line);border-radius:13px;
  padding:12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.10);
}

.lnk i{font-style:normal;font-size:11px;color:var(--dim)}

/* ── 고르개(칩) — 드롭다운은 쓰지 않는다 ────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:13px;font-weight:600;color:var(--fg2);cursor:pointer;
}

.fld{
  width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;
  padding:11px 13px;font-size:15px;margin-bottom:9px;
}

/* ── 첫 화면(암호) ───────────────────────────────────── */

.gate p{color:var(--dim);font-size:13.5px;margin:0 0 18px;line-height:1.6}
.btn{
  width:100%;background:var(--accent);color:var(--on);border:0;border-radius:12px;
  padding:13px;font-size:15px;font-weight:800;cursor:pointer;
}
.btn.ghost{background:var(--card);color:var(--fg2);border:1px solid var(--line)}
.btn.ghost:active,.chip:active{background:var(--soft)}
.err{color:var(--warn);font-size:13px;margin-top:10px;min-height:18px;font-weight:700}

/* ── 새 판 띠 ────────────────────────────────────────── */
.newver{
  position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));
  background:var(--accent);color:var(--on);border-radius:13px;
  padding:12px 14px;display:none;align-items:center;gap:10px;z-index:50;
  box-shadow:0 6px 20px rgba(0,0,0,.28);font-size:13.5px;font-weight:700;
}
.newver button{
  margin-left:auto;background:var(--on);color:var(--accent);border:0;border-radius:9px;
  padding:7px 13px;font-weight:800;font-size:13px;cursor:pointer;
}
.foot{text-align:center;color:var(--dim);font-size:11.5px;padding:22px 0 6px;line-height:1.7}
.spin{text-align:center;color:var(--dim);padding:44px 0;font-size:14px}

/* 태블릿(갤럭시탭 S7 FE 등) — 넓으면 타일을 더 벌린다 */
@media (min-width:640px){
  :root{--pad:24px}
  .tiles{grid-template-columns:repeat(3,1fr)}

  .top{max-width:900px;margin:0 auto}
}
@media (min-width:900px){
  .tiles{grid-template-columns:repeat(4,1fr)}
  .links{grid-template-columns:repeat(4,1fr)}
}

.nmstep{margin:6px 0 0;padding-left:20px;line-height:1.75}

.nmimg.s{max-height:78px;border-radius:8px}.nmimg.q{max-height:190px;margin:0 auto}
.nmid{font-size:44px;font-weight:900;letter-spacing:1px;color:var(--accent)}.nmid.s{font-size:20px}.nmid.q{font-size:48px;text-align:center}
.nmname{font-size:40px;font-weight:900;color:var(--accent)}.nmsub{font-size:14px;color:var(--dim);font-weight:700}.nmhint{font-size:12.5px;color:var(--dim);font-weight:700}
.nmctl .btn{flex:1}
.nmscore{font-size:13px;font-weight:700;color:var(--dim);margin:8px 2px}.nmscore b{color:var(--accent);font-size:16px}
.nmqbox{padding:14px;border-radius:16px;border:2px solid var(--accent);background:var(--card);text-align:center;margin-bottom:10px}
.nmqask{margin-top:10px;font-weight:800;font-size:15px}
.nmopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.nmopt{padding:14px 6px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-weight:800;font-size:16px;cursor:pointer}
.nmopt.right{background:var(--ok);color:var(--on);border-color:var(--ok)}.nmopt.wrong{background:var(--warn);color:var(--on);border-color:var(--warn)}.nmopt.dim{opacity:.45}
.nmres{padding:10px 12px;border-radius:12px;margin:6px 0 10px;font-weight:800;font-size:15px;text-align:center}
.nmres.ok{background:color-mix(in srgb,var(--ok) 16%,var(--bg));color:var(--ok)}.nmres.bad{background:color-mix(in srgb,var(--warn) 16%,var(--bg));color:var(--warn)}
.nmtyped{font-size:18px;text-align:center}.nmtyped.ok{border-color:var(--ok)}.nmtyped.bad{border-color:var(--warn)}
.nmpair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}.nmcol{display:flex;flex-direction:column;gap:8px}
.nmpl,.nmpr{min-height:84px;display:flex;align-items:center;justify-content:center;padding:6px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.nmpl.sel,.nmpr.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent)}
.nmpl.done,.nmpr.done{opacity:.35;border-style:dashed}
.nmres2{padding:18px 14px}.nmbig{font-size:46px;font-weight:900;color:var(--accent);margin:6px 0}
.nmwrong{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.nmwk{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:700}
.nmwk img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.top .logo{width:34px;height:34px}


/* ═══ 지비스 모바일 v2 — 더한 서식 ═══════════════════════════════ */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
/* 손가락 크기 — 눌러야 하는 것은 44px 이상 */
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 15px}
.seg2 .chip{justify-content:center;padding:0}
.btn.sm{min-height:44px}
.top .back{min-width:44px;min-height:44px;padding:6px 8px}

.att-tags{align-items:center}

.muted,.note2{font-size:12.5px}
main.wrap{display:block}

/* 하단 메뉴 — 4칸 + 더보기 */
.nav{padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.nav button{min-height:56px;justify-content:center;font-size:12px;letter-spacing:-.2px}
.nav button .li{padding:4px 20px}
.nav button .li{-webkit-touch-callout:none}
.nav button{-webkit-user-select:none;user-select:none}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--card);border-radius:22px 22px 0 0;padding:14px var(--pad) calc(18px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto;box-shadow:0 -10px 30px rgba(0,0,0,.2)}
.sheeth{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}.sheeth b{font-size:17px}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mtile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;min-height:88px;padding:12px 6px;border-radius:16px;background:var(--bg);border:1px solid var(--line);color:var(--fg);font-size:13px;font-weight:700;cursor:pointer}

.npreview{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}.npreview span{display:inline-flex;align-items:center;gap:5px;padding:6px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12.5px;font-weight:700}.npreview .li{width:16px;height:16px;color:var(--accent)}

/* 하단 메뉴 편집 */
.ned{position:fixed;inset:0;z-index:40;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) var(--pad) 0;display:flex;flex-direction:column;overflow:auto}
.nedh{display:flex;align-items:center;justify-content:space-between}.nedh b{font-size:18px}
.nedp{color:var(--fg2);font-size:14px;margin:8px 0 14px;line-height:1.55}.nedp small{color:var(--dim);font-size:12.5px}
.npool{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.ntile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:84px;padding:14px 6px 10px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);color:var(--fg);font-size:13px;font-weight:700;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.ntile .li{width:24px;height:24px;color:var(--accent)}
.ntile .grip{position:absolute;top:6px;right:6px;display:block;line-height:0}.ntile .grip .li{width:14px;height:14px;color:var(--dim)}
.ntile.sel{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.ntile.hot{border-color:var(--accent);border-style:dashed;background:var(--soft)}
.ntile.drag{opacity:.35}
.ntile.ghost{position:fixed;z-index:60;width:96px;pointer-events:none;transform:rotate(4deg) scale(1.06);box-shadow:0 14px 28px rgba(0,0,0,.3);margin:0}
.nedbar{position:sticky;bottom:0;margin:auto calc(-1 * var(--pad)) 0;padding:10px var(--pad) calc(10px + env(safe-area-inset-bottom));background:var(--bar);border-top:1px solid var(--line)}
.nedslots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ntile.slot,.ntile.fixed{min-height:72px;padding:12px 2px 8px;font-size:11.5px}
.ntile.slot:not(.drag):not(.sel){animation:wig .55s ease-in-out infinite alternate}
.ntile.fixed{opacity:.5;border-style:dashed;cursor:default}
@keyframes wig{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}

/* 가벼운 알림 */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));z-index:60;background:var(--fg);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;max-width:86vw;text-align:center}

/* 잠금 · 연결 */
.lock{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;text-align:center}
.lock .llogo{width:64px;height:64px;object-fit:contain}.lock h1{margin:6px 0 0;font-size:22px}
.lock .lt{font-weight:800;font-size:16px;margin:14px 0 2px}.lock .lsub{color:var(--dim);font-size:13.5px;max-width:300px;line-height:1.6;margin:6px 0 16px}
.dots{display:flex;gap:14px;margin:12px 0 2px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--dim);display:block}.dots i.on{background:var(--accent);border-color:var(--accent)}
.dots.shake{animation:shk .4s}@keyframes shk{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.lerr{min-height:24px;margin:6px 0;color:var(--warn);font-size:13.5px;font-weight:700;max-width:300px}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:12px;margin-top:6px}
.pk{width:76px;height:64px;border-radius:32px;background:var(--card);border:1px solid var(--line);color:var(--fg);font-size:24px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pk:active{background:var(--soft)}.pk.fn{background:none;border-color:transparent}.pk.fn .li{width:26px;height:26px;color:var(--accent)}.pk.fn.t{font-size:15px}
.pk:disabled{opacity:.5}
.gate .fld{margin-bottom:10px}

/* 홈 */
.hcard{all:unset;box-sizing:border-box;display:block;width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh);cursor:pointer}
.hcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hcard .hh{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--accent)}.hcard .hh .li{width:20px;height:20px}
.hcard .hh b{color:var(--fg);font-size:15px;flex:1}.hcard .chev .li{width:18px;height:18px;color:var(--dim)}.hcard .chev{line-height:0}

.plist li b{width:48px;flex:none;color:var(--dim);font-size:13px}.plist li.now{font-weight:800}.plist li.now b{color:var(--accent)}.plist li.past{opacity:.7}
.plist li em{margin-left:auto;font-style:normal;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--accent);color:var(--on)}

.qrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}

/* 점검 반영 — 작은 글자는 12px 이상 · 옅은 바탕 위 글자는 대비 4.5:1 이상 */
small,.foot,.nav button span,.tt th,.tt td u,.chipx,.attdel,.meal .sch em,.dirty,.tg{font-size:12px}

textarea{font:inherit;color:inherit}

.mldate input{min-height:44px}

/* 학년부 일지 — 구분마다 색(8가지) */
.gpl{display:block;margin-top:4px;padding:6px 9px;border-radius:10px;font-size:13.5px;line-height:1.5;font-weight:600;background:hsl(calc(var(--hu,0) * 45) 55% 92%);color:hsl(calc(var(--hu,0) * 45) 60% 24%)}
.gpl b{font-size:12px;margin-right:6px}.gpl em{font-style:normal;font-size:12px;font-weight:800;margin-right:6px;padding:1px 7px;border-radius:999px;background:hsl(calc(var(--hu,0) * 45) 55% 82%)}
.gpl small{display:block;margin-top:2px;font-size:12px;font-weight:500;white-space:pre-line;opacity:.9}.gpl.done{opacity:.6;text-decoration:line-through}
.gpl.h0,.chip.gpc.h0{--hu:0}.gpl.h1,.chip.gpc.h1{--hu:1}.gpl.h2,.chip.gpc.h2{--hu:2}.gpl.h3,.chip.gpc.h3{--hu:3}.gpl.h4,.chip.gpc.h4{--hu:4}.gpl.h5,.chip.gpc.h5{--hu:5}.gpl.h6,.chip.gpc.h6{--hu:6}.gpl.h7,.chip.gpc.h7{--hu:7}
.chip.gpc{background:hsl(calc(var(--hu,0) * 45) 55% 94%);color:hsl(calc(var(--hu,0) * 45) 60% 24%);border-color:hsl(calc(var(--hu,0) * 45) 40% 78%)}
.chip.gpc.on{background:hsl(calc(var(--hu,0) * 45) 55% 30%);color:#fff;border-color:transparent}
@media (prefers-color-scheme:dark){

  :root:not([data-theme="light"]) .gpl em{background:hsl(calc(var(--hu,0) * 45) 30% 30%)}
  :root:not([data-theme="light"]) .chip.gpc{background:hsl(calc(var(--hu,0) * 45) 30% 18%);color:hsl(calc(var(--hu,0) * 45) 70% 84%);border-color:hsl(calc(var(--hu,0) * 45) 25% 32%)}
  :root:not([data-theme="light"]) .chip.gpc.on{background:hsl(calc(var(--hu,0) * 45) 60% 78%);color:#111}
}

.chip .li{width:18px;height:18px;display:block}

/* 시간표(체육수업진도) 확대·축소·맞춤 */
#jdzoom{position:fixed;right:10px;z-index:6;display:none;gap:2px;align-items:center;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.25)}

#jdzoom button[data-z="fit"]{font-size:14px;padding:0 12px}

/* ═══ 반응형 — 폴드6 접음(겉화면 약 360px 폭) / 폴드6 펼침(안화면 약 880×820, 거의 정사각) / 태블릿 ═══
   · 좁은 화면(≤ 699px): 하단 메뉴 + 한 줄 카드 (위의 서식 그대로)

var VERSION = '2.12.0';
/* ── 테마 — auto · light · dark. 고른 것은 이 폰에만 기억한다 ── */
var THEMES = [['auto', '자동', ['#FAFAF9', '#C1121F', '#0E1413', '#5EEAD4']], ['light', '화이트·레드', ['#FAFAF9', '#FFFFFF', '#FCE9EA', '#C1121F']], ['dark', '다크·민트', ['#0E1413', '#172120', '#12302D', '#5EEAD4']]];
var THEME = (function () { var t = ''; try { t = localStorage.getItem('jv.theme') || ''; } catch (e) { /* */ } return /^(auto|light|dark)$/.test(t) ? t : 'auto'; })();
function applyTheme() {
  var root = document.documentElement;
  if (THEME === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', THEME);
  var dark = THEME === 'dark' || (THEME === 'auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  var c = dark ? '#172120' : '#FFFFFF';
  [].forEach.call(document.querySelectorAll('meta[name="theme-color"]'), function (m) { m.setAttribute('content', c); m.removeAttribute('media'); });   // 상단 바 색도 따라가게
}
function setTheme(t) { if (!/^(auto|light|dark)$/.test(t)) return; THEME = t; try { localStorage.setItem('jv.theme', t); } catch (e) { /* 못 써도 이번만 적용 */ } applyTheme(); }
applyTheme();
if (window.matchMedia) { try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { if (THEME === 'auto') applyTheme(); }); } catch (e) { /* 옛 브라우저 */ } }

var DOWN = ['일','월','화','수','목','금','토'];

  get: function (k, d) {
    try { var v = localStorage.getItem('jv.' + k); return v === null ? d : v; }
    catch (e) { return d; }
  },
  set: function (k, v) { try { localStorage.setItem('jv.' + k, v); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem('jv.' + k); } catch (e) {} }
};

var ME = LS.get('me', '');          // 내 이름 (컴시간 교사 이름)

var D = null;                        // 허브에서 받은 것
var ERR = '';
var LOADING = false;

/* ── 잔손 ────────────────────────────────────────────── */
function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
function todayStr() {
  var d = new Date();
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
}
function todayDow() { return DOWN[new Date().getDay()]; }
function isWeekday() { var g = new Date().getDay(); return g >= 1 && g <= 5; }


/* ══ 허브 — 자료는 모두 «지비스 허브» 한 문으로 ═══════════════
   ★ 이 폰은 «기기 열쇠»(64자) 하나만 가진다. 허브가 혜원폰 다리·출결 다리를 대신 부른다. 그 다리들의 주소·열쇠는 폰에 없다.
   ★ 허브 주소도 코드에 없다 — «연결 링크»(PC 가 만든다)로 처음 한 번 들어온다.
   ★ 부를 때 구글 계정 쿠키를 보내지 않는다(credentials omit) — 만 13세 미만 계정 차단과 상관없이 열린다. */
var HUB = { url: LS.get('hub', ''), key: LS.get('dkey', ''), name: LS.get('dname', ''), cfg: { cls: '3-2', teacher: '김진호' } };
try { var __c = JSON.parse(LS.get('cfg', 'null')); if (__c && __c.cls) HUB.cfg = { cls: String(__c.cls), teacher: String(__c.teacher || '김진호') }; } catch (e) { /* 기본값 */ }
var HUBRE = /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]{20,200}\/exec$/;
function hubPost(op, body, ms) {
  if (!HUB.url) return Promise.reject(new Error('허브 주소가 없습니다'));
  var b = { op: op };
  if (HUB.key && op !== 'enroll') b.key = HUB.key;
  for (var k in (body || {})) b[k] = body[k];
  var ctl = (typeof AbortController === 'function') ? new AbortController() : null;
  var tm = ctl ? setTimeout(function () { ctl.abort(); }, ms || 45000) : 0;
  return fetch(HUB.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(b), redirect: 'follow', credentials: 'omit', signal: ctl ? ctl.signal : undefined })
    .then(function (r) { return r.text(); })
    .then(function (txt) {
      clearTimeout(tm);
      var j; try { j = JSON.parse(txt); } catch (e) { throw new Error('허브가 제대로 답하지 않았습니다'); }
      if (j && j.ok === false && j.code === 'key' && op !== 'enroll') hubCut('열쇠가 맞지 않습니다 — 이 폰이 끊겼습니다. 새 연결 링크로 다시 연결해 주세요.');
      return j;
    }, function (e) { clearTimeout(tm); throw (e && e.name === 'AbortError') ? new Error('허브가 늦게 답합니다') : e; });
}
/* 열쇠가 거절당했다 = 이 폰은 취소됐다. 폰 안의 열쇠와 자료를 모두 치운다 */
function hubCut(msg) {
  LS.del('dkey'); HUB.key = ''; D = null; LS.del('cache'); LS.del('cacheAt'); LS.del('gpc'); GP.grades = null; GP.fresh = false;
  PAIR.err = msg || ''; PAIR.step = 'ask';
  if (typeof wipeMem === 'function') wipeMem();
  VIEW = 'pair'; draw();
}

/* ── 연결 링크 ──
   .../jivis_mobile/#p=<base64url(JSON {u:허브주소, c:연결코드})> — PC 의 지비스가 만든다. 주소 칸의 «#» 뒤는 서버로 가지 않는다. */
var PAIR = { step: 'ask', u: '', c: '', name: '', busy: false, err: '', guest: false };
function b64uDecode(s) {
  s = String(s || '').replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '=';
  var bin = atob(s), bytes = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function pairParse(text) {      // 링크 전체 또는 «#p=…» 또는 «p=…» 만 와도 읽는다
  var m = String(text || '').match(/[#&?]?p=([A-Za-z0-9_-]{20,1200})/);
  if (!m) return { ok: false, msg: '연결 링크가 아닙니다 (… #p=… 로 끝나는 주소)' };
  var j; try { j = JSON.parse(b64uDecode(m[1])); } catch (e) { return { ok: false, msg: '연결 링크를 읽지 못했습니다' }; }
  var u = String((j && j.u) || ''), c = String((j && j.c) || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (!HUBRE.test(u)) return { ok: false, msg: '허브 주소가 올바르지 않습니다' };
  if (c.length !== 8) return { ok: false, msg: '연결 코드가 올바르지 않습니다' };
  return { ok: true, u: u, c: c };
}
function pairFromHash() {       // 앱을 링크로 열었을 때 — 주소창에서는 바로 지운다
  var h = String(location.hash || ''); if (h.indexOf('p=') < 0) return false;
  var r = pairParse(h);
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* */ }
  if (!r.ok) { PAIR.err = r.msg; return false; }
  PAIR.u = r.u; PAIR.c = r.c; PAIR.step = 'name'; PAIR.name = pairDefName(); PAIR.err = '';
  return true;
}
function pairDefName() {
  var ua = navigator.userAgent || '';
  return /iPhone/.test(ua) ? '아이폰' : /iPad/.test(ua) ? '아이패드' : /Android/.test(ua) ? (/Mobile/.test(ua) ? '안드로이드 폰' : '안드로이드 탭') : '기기';
}
function viewPair() {
  var h = '<main class="gate"><img src="logo-256.png" alt=""><h1>지비스</h1>';
  if (PAIR.step === 'name') {
    return h + '<p>이 폰을 <b>김진호 선생님 전용</b> 지비스에 연결합니다.<br>연결하면 이 폰만의 열쇠가 생기고, 잃어버리면 PC 에서 이 폰만 끊을 수 있습니다.</p>'
      + '<label class="att-lab" for="pName" style="text-align:left;width:100%">이 폰 이름</label>'
      + '<input class="fld" id="pName" maxlength="24" autocomplete="off" value="' + esc(PAIR.name) + '">'
      + '<button type="button" class="btn" id="pGo"' + (PAIR.busy ? ' disabled' : '') + '>' + (PAIR.busy ? '연결하는 중…' : '연결하기') + '</button>'
      + '<div class="err" role="status">' + esc(PAIR.err) + '</div></main>';
  }
  return h + '<p>선생님 전용 앱입니다. <b>지비스(PC)</b>가 만든 <b>연결 링크</b>로 이 폰을 한 번 연결해야 열립니다.</p>'
    + '<label class="att-lab" for="pLink" style="text-align:left;width:100%">연결 링크 붙여넣기</label>'
    + '<input class="fld" id="pLink" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://…/#p=…">'
    + '<button type="button" class="btn" id="pRead">링크 확인</button>'
    + '<button type="button" class="btn ghost" style="margin-top:10px" data-pair="guest">연결 전에 «이름 외우기»만 먼저 쓰기</button>'
    + '<div class="err" role="status">' + esc(PAIR.err) + '</div></main>';
}
function pairEnroll() {
  if (PAIR.busy) return; PAIR.busy = true; PAIR.err = ''; draw();
  HUB.url = PAIR.u; HUB.key = '';
  hubPost('enroll', { pair: PAIR.c, name: PAIR.name || pairDefName() }).then(function (j) {
    PAIR.busy = false;
    if (!j || !j.ok) { HUB.url = LS.get('hub', ''); PAIR.err = (j && j.msg) || '연결하지 못했습니다'; if (j && j.code === 'pair') PAIR.err += ' — PC 에서 새 연결 링크를 만들어 주세요(5분 안에 한 번만 쓸 수 있습니다).'; draw(); return; }
    HUB.key = j.key; HUB.name = j.name || PAIR.name;
    LS.set('hub', HUB.url); LS.set('dkey', HUB.key); LS.set('dname', HUB.name);
    PAIR.c = ''; PAIR.u = ''; PAIR.step = 'ask';
    hubWho().then(function () { afterPaired(); });
  }).catch(function (e) { PAIR.busy = false; HUB.url = LS.get('hub', ''); PAIR.err = '연결하지 못했습니다 — ' + ((e && e.message) || e); draw(); });
}
function hubWho() {
  return hubPost('who').then(function (j) {
    if (j && j.ok) { HUB.cfg = { cls: String(j.cls || '3-2'), teacher: String(j.teacher || '김진호') }; LS.set('cfg', JSON.stringify(HUB.cfg)); if (j.name) { HUB.name = j.name; LS.set('dname', j.name); } }
  }).catch(function () { /* 지난번 값을 쓴다 */ });
}

/* ── 이 폰과 PC·다른 폰이 함께 보는 작은 값(하단 메뉴 · 사유 문구 · 내 이름) ──
   나중에 쓴 쪽이 이긴다. 허브가 못 열려도 폰은 자기 값으로 돈다. */
var KVN = ['nav', 'attphr', 'me'];
function kvGetLocal(n) { try { var o = JSON.parse(LS.get('kv.' + n, 'null')); return (o && typeof o.t === 'number') ? o : null; } catch (e) { return null; } }
function kvSave(n, v) {          // 이 폰에서 바뀜 → 저장하고 허브에 올린다
  var it = { v: v, t: Date.now() }; LS.set('kv.' + n, JSON.stringify(it));
  if (!HUB.key) return;
  var items = {}; items[n] = it;
  hubPost('kset', { items: items }).then(function (j) { if (j && j.ok && j.newer && j.newer[n] && !j.newer[n].err) kvApply(n, j.newer[n]); }).catch(function () { /* 다음에 다시 맞춘다 */ });
}
function kvApply(n, it) {
  LS.set('kv.' + n, JSON.stringify(it));
  if (n === 'nav') { navSet(it.v, true); }
  else if (n === 'attphr') { if (Array.isArray(it.v)) { ATT.phr = it.v.filter(function (x) { return typeof x === 'string' && x.trim(); }).slice(0, 20); ATT.phrAt = attKst(); LS.set('attphr', JSON.stringify(ATT.phr)); } }
  else if (n === 'me') { if (typeof it.v === 'string') { ME = it.v; LS.set('me', ME); } }
}
function kvPull() {
  if (!HUB.key) return;
  hubPost('kget', { names: KVN }).then(function (j) {
    if (!j || !j.ok) return;
    var redraw = false;
    KVN.forEach(function (n) {
      var r = (j.items || {})[n], l = kvGetLocal(n);
      if (r && (!l || r.t > l.t)) { kvApply(n, r); redraw = true; }
      else if (l && (!r || l.t > r.t)) { var o = {}; o[n] = l; hubPost('kset', { items: o }).catch(function () { /* */ }); }
    });
    if (redraw && !LOCK.on) draw();
  }).catch(function () { /* 오프라인이면 그대로 */ });
}

/* ══ 앱 잠금 — 지문(기기 생체 인증) 우선, 숫자 6자리는 대신 여는 열쇠 ═══════════
   ★ 이 잠금은 «화면을 가리는» 잠금이다. 허브 열쇠·학생 자료를 암호로 감싸지는 않는다 — 폰 화면 잠금도 꼭 켜 둘 것.
   ★ 지문은 WebAuthn(기기 안의 인증기)으로 확인한다 — 지문 정보는 앱도 서버도 보지 못하고, «본인 확인이 됐다/안 됐다» 만 돌아온다.
   ★ 숫자는 PBKDF2(12만 번)로 섞어 저장한다. 틀리면 5번째부터 30초·1분·2분… 기다리게 한다(최대 15분). */
var PIN_LEN = 6;
var LOCK = { on: false, flow: null, buf: '', err: '', busy: false, hiddenAt: 0, shake: false };
function lockCfg() { try { var c = JSON.parse(LS.get('lock', 'null')); return (c && c.hash && c.salt) ? c : null; } catch (e) { return null; } }
function lockSaveCfg(c) { LS.set('lock', JSON.stringify(c)); }
function b64(buf) { var a = new Uint8Array(buf), s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); }
function unb64(s) { var bin = atob(s), a = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; }
function pinHash(pin, salt) {
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits'])
    .then(function (k) { return crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unb64(salt), iterations: 120000, hash: 'SHA-256' }, k, 256); })
    .then(b64);
}
function lockWait() {      // 지금 기다려야 하는 초(없으면 0)
  try { var f = JSON.parse(LS.get('lfail', 'null')); if (f && f.until > Date.now()) return Math.ceil((f.until - Date.now()) / 1000); } catch (e) { /* */ }
  return 0;
}
function lockFail() {
  var f = { n: 0, until: 0 }; try { f = JSON.parse(LS.get('lfail', 'null')) || f; } catch (e) { /* */ }
  f.n = (f.n || 0) + 1; f.until = f.n >= 5 ? Date.now() + Math.min(900000, 30000 * Math.pow(2, f.n - 5)) : 0;
  LS.set('lfail', JSON.stringify(f));
}
function lockOk() { LS.del('lfail'); }

/* 잠금 화면에 «숫자판 흐름» 을 올린다 */
function lockFlow(kind, step) { LOCK.flow = { kind: kind, step: step, first: '' }; LOCK.buf = ''; LOCK.err = ''; LOCK.on = (kind === 'unlock' || kind === 'setup'); draw(); }
function lockStart() {         // 앱을 열 때 — 연결된 폰이면 잠금(또는 처음 설정)부터
  if (!HUB.key) { LOCK.on = false; LOCK.flow = null; return false; }
  if (!lockCfg()) lockFlow('setup', 'new'); else { lockFlow('unlock', 'pin'); lockBioAuto(); }
  return true;
}
function lockNow() { if (!HUB.key || !lockCfg() || LOCK.flow) return; wipeMem(); lockFlow('unlock', 'pin'); lockBioAuto(); }
function wipeMem() {           // 잠기면 메모리의 학생 자료부터 치운다(사진·출결·연락처·수업진도 웹앱)
  try { jdDestroy(); JDT.records = {}; JDT.rec = ''; JDT.day = ''; MEMO.key = ''; MEMO.text = ''; MEMO.busy = false; MEMO.err = ''; MEMO.lessons = {}; } catch (e) { /* */ }
  try {
    ATT.rows = null; ATT.roster = null; ATT.form = null; ATT.last = null; ATT.me = null; ATT.st = 'idle'; ATT.busy = false;
    SMS.cons = {}; SMS.consLoaded = false; SMS.rosterList = null; SMS.who = ''; SMS.num = ''; SMS.paste = null; SMS.cedit = null;
    NM.data = null; NM.loaded = false; NM_MEM = null; nmReset();
    HOMEATT.n = null; HOMEATT.err = ''; HOMEATT.busy = false;
  } catch (e) { /* 아직 안 만든 것이 있어도 괜찮다 */ }
}
function lockDone() {          // 열림 — 자료를 새로 받는다
  LOCK.flow = null; LOCK.on = false; LOCK.buf = ''; LOCK.err = ''; VIEW = (VIEW === 'pair') ? 'home' : VIEW;
  histReset(); draw(); load(); kvPull();
}

/* ── 지문 ── */
function bioSupported() { return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create); }
function bioRegister() {
  var ch = crypto.getRandomValues(new Uint8Array(32)), uid = crypto.getRandomValues(new Uint8Array(16));
  return navigator.credentials.create({ publicKey: { challenge: ch, rp: { name: '지비스' }, user: { id: uid, name: 'jivis', displayName: '김진호' },
    pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }], timeout: 60000, attestation: 'none',
    authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged' } } })
    .then(function (c) { return b64(c.rawId); });
}
function bioCheck(id) {
  return navigator.credentials.get({ publicKey: { challenge: crypto.getRandomValues(new Uint8Array(32)), timeout: 60000, userVerification: 'required',
    allowCredentials: [{ type: 'public-key', id: unb64(id), transports: ['internal'] }] } }).then(function () { return true; });
}
function lockBioAuto() { var c = lockCfg(); if (c && c.bio && bioSupported()) setTimeout(lockBio, 250); }
function lockBio() {
  var c = lockCfg(); if (!c || !c.bio || LOCK.busy || !LOCK.flow || LOCK.flow.kind !== 'unlock') return;
  LOCK.busy = true;
  bioCheck(c.bio).then(function () { LOCK.busy = false; lockOk(); lockDone(); })
    .catch(function () { LOCK.busy = false; /* 취소·실패 — 숫자로 열면 된다 */ });
}

/* ── 숫자판 ── */
function lockKey(d) {
  if (LOCK.busy || !LOCK.flow) return;
  var w = (LOCK.flow.kind === 'unlock' || LOCK.flow.step === 'old') ? lockWait() : 0;
  if (w) { LOCK.err = w + '초 뒤에 다시 해 주세요'; draw(); return; }
  if (d === 'del') { LOCK.buf = LOCK.buf.slice(0, -1); LOCK.err = ''; draw(); return; }
  if (LOCK.buf.length >= PIN_LEN) return;
  LOCK.buf += d; LOCK.err = '';
  if (LOCK.buf.length < PIN_LEN) { draw(); return; }
  var pin = LOCK.buf; LOCK.buf = ''; LOCK.busy = true; draw();
  lockSubmit(pin).then(function () { LOCK.busy = false; draw(); }, function () { LOCK.busy = false; LOCK.err = '확인하지 못했습니다'; draw(); });
}
function lockSubmit(pin) {
  var f = LOCK.flow, c = lockCfg();
  if (f.kind === 'unlock' || f.step === 'old') {
    return pinHash(pin, c.salt).then(function (h) {
      if (h === c.hash) { lockOk(); if (f.kind === 'unlock') lockDone(); else { f.step = 'new'; LOCK.err = ''; } }
      else { lockFail(); var w = lockWait(); LOCK.err = w ? '여러 번 틀렸습니다 — ' + w + '초 뒤에 다시' : '숫자가 맞지 않습니다'; LOCK.shake = true; }
    });
  }
  if (f.step === 'new') { f.first = pin; f.step = 'again'; return Promise.resolve(); }
  if (f.step === 'again') {
    if (pin !== f.first) { f.step = 'new'; f.first = ''; LOCK.err = '두 번이 서로 달라요 — 처음부터 다시 정해 주세요'; return Promise.resolve(); }
    var salt = b64(crypto.getRandomValues(new Uint8Array(16)));
    return pinHash(pin, salt).then(function (h) {
      var old = lockCfg() || {};
      lockSaveCfg({ salt: salt, hash: h, bio: old.bio || '', after: old.after == null ? 60 : old.after });
      lockOk();
      if (f.kind === 'setup' && bioSupported()) { f.step = 'bio'; } else if (f.kind === 'setup') lockDone(); else { LOCK.flow = null; LOCK.err = ''; draw(); toast('숫자를 바꿨습니다'); }
    });
  }
  return Promise.resolve();
}
function lockTitle() {
  var f = LOCK.flow; if (!f) return '';
  if (f.kind === 'unlock') return '잠겨 있습니다';
  if (f.step === 'old') return '지금 쓰는 숫자 6자리';
  if (f.step === 'new') return f.kind === 'setup' ? '앱을 열 때 쓸 숫자 6자리를 정하세요' : '새 숫자 6자리';
  if (f.step === 'again') return '한 번 더 눌러 주세요';
  return '';
}
function viewLock() {
  var f = LOCK.flow, c = lockCfg();
  var h = '<main class="lock"><img class="llogo" src="logo-256.png" alt=""><h1>지비스</h1>';
  if (f.step === 'bio') {
    return h + '<p class="lt">지문으로도 열까요?</p><p class="lsub">폰에 등록된 지문(또는 얼굴)으로 확인합니다. 숫자는 그대로 남아 있어 지문이 안 될 때 쓸 수 있습니다.</p>'
      + '<button type="button" class="btn" data-lk="bioon">' + lineIc('fingerprint') + ' 지문으로 열기 켜기</button>'
      + '<button type="button" class="btn ghost" style="margin-top:10px" data-lk="biolater">나중에</button>'
      + '<div class="lerr" role="status">' + esc(LOCK.err) + '</div></main>';
  }
  var dots = ''; for (var i = 0; i < PIN_LEN; i++) dots += '<i class="' + (i < LOCK.buf.length ? 'on' : '') + '"></i>';
  h += '<p class="lt">' + esc(lockTitle()) + '</p><div class="dots' + (LOCK.shake ? ' shake' : '') + '" aria-label="입력한 숫자 ' + LOCK.buf.length + '개">' + dots + '</div>'
    + '<div class="lerr" role="status">' + esc(LOCK.err) + '</div><div class="pad" role="group" aria-label="숫자판">';
  [1, 2, 3, 4, 5, 6, 7, 8, 9].forEach(function (n) { h += '<button type="button" class="pk" data-lk="k" data-v="' + n + '"' + (LOCK.busy ? ' disabled' : '') + '>' + n + '</button>'; });
  var bio = f.kind === 'unlock' && c && c.bio && bioSupported();
  h += (bio ? '<button type="button" class="pk fn" data-lk="bio" aria-label="지문으로 열기">' + lineIc('fingerprint') + '</button>'
      : (f.kind === 'change' ? '<button type="button" class="pk fn t" data-lk="cancel">취소</button>' : '<span></span>'))
    + '<button type="button" class="pk" data-lk="k" data-v="0"' + (LOCK.busy ? ' disabled' : '') + '>0</button>'
    + '<button type="button" class="pk fn" data-lk="k" data-v="del" aria-label="지우기">' + lineIc('back') + '</button></div></main>';
  return h;
}
function lockWire() {
  APP.querySelectorAll('[data-lk]').forEach(function (b) {
    b.addEventListener('click', function () {
      var a = b.dataset.lk;
      if (a === 'k') lockKey(b.dataset.v);
      else if (a === 'bio') lockBio();
      else if (a === 'cancel') { LOCK.flow = null; LOCK.on = false; LOCK.buf = ''; LOCK.err = ''; draw(); }
      else if (a === 'bioon') {
        bioRegister().then(function (id) { var c = lockCfg(); if (c) { c.bio = id; lockSaveCfg(c); } lockDone(); })
          .catch(function (e) { LOCK.err = '지문을 켜지 못했습니다' + (e && e.name === 'NotAllowedError' ? ' (취소됐거나 폰에 지문이 등록돼 있지 않습니다)' : ''); draw(); });
      }
      else if (a === 'biolater') lockDone();
    });
  });
  if (LOCK.shake) setTimeout(function () { LOCK.shake = false; }, 500);
}
/* 설정 화면용 조각 */
function lockSettingsHtml() {
  var c = lockCfg(); if (!c) return '';
  var after = c.after == null ? 60 : c.after;
  return '<div class="card"><h2>잠금</h2>'
    + '<div class="att-lab">다시 잠기는 때 <small>(앱을 벗어난 뒤)</small></div><div class="chips">' + [[0, '바로'], [60, '1분 뒤'], [300, '5분 뒤']].map(function (o) {
      return '<button type="button" class="chip' + (after === o[0] ? ' on' : '') + '" data-lkset="after" data-v="' + o[0] + '" aria-pressed="' + (after === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div>'
    + '<div class="att-lab">지문으로 열기</div><div class="chips">'
    + (bioSupported() ? '<button type="button" class="chip' + (c.bio ? ' on' : '') + '" data-lkset="bio" data-v="' + (c.bio ? '0' : '1') + '" aria-pressed="' + (!!c.bio) + '">' + (c.bio ? '켜져 있음 · 끄기' : '꺼져 있음 · 켜기') + '</button>' : '<span class="muted">이 기기는 지문 확인을 지원하지 않습니다</span>') + '</div>'
    + '<div class="mlrow" style="margin-top:12px"><button type="button" class="btn ghost" data-lkset="pin">숫자 바꾸기</button><button type="button" class="btn ghost" data-lkset="now">지금 잠그기</button></div></div>';
}
function lockSetAct(a, v) {
  var c = lockCfg(); if (!c) return;
  if (a === 'after') { c.after = Number(v); lockSaveCfg(c); draw(); }
  else if (a === 'bio') {
    if (v === '0') { c.bio = ''; lockSaveCfg(c); draw(); }
    else bioRegister().then(function (id) { var k = lockCfg(); k.bio = id; lockSaveCfg(k); draw(); toast('지문으로 열기를 켰습니다'); }).catch(function () { toast('지문을 켜지 못했습니다'); });
  }

document.addEventListener('visibilitychange', function () {
  if (document.hidden) { LOCK.hiddenAt = Date.now(); return; }
  var c = lockCfg();
  if (c && HUB.key && !LOCK.flow && LOCK.hiddenAt && Date.now() - LOCK.hiddenAt >= (c.after == null ? 60 : c.after) * 1000) lockNow();
  LOCK.hiddenAt = 0;
});

/* ── 허브에서 받기 ── */
function load(fresh) {
  if (!HUB.key) { VIEW = 'pair'; draw(); return; }
  LOADING = true; ERR = ''; if (!LOCK.flow) draw();
  hubPost('data', { what: 'all', fresh: fresh ? 1 : undefined }).then(function (j) {
    LOADING = false;
    if (!j || !j.ok) { ERR = (j && (j.error || j.msg)) || '자료를 받지 못했습니다'; if (!LOCK.flow) draw(); return; }
    D = j;
    LS.set('cache', JSON.stringify(j));
    LS.set('cacheAt', new Date().toISOString());
    if (!LOCK.flow) draw();
  }).catch(function (e) {
    LOADING = false;
    /* 인터넷이 없거나 허브가 늦을 때 — 지난번에 받아 둔 것이라도 보여 준다 */
    var c = LS.get('cache', '');
    if (c && !D) { try { D = JSON.parse(c); } catch (e2) { /* */ } }
    ERR = '지금은 못 받았습니다 — ' + ((e && e.message) || e);
    if (!LOCK.flow) draw();
  });
}
/* 한 가지만 따로 부르기 (학급 시간표·급식 주 넘기기·급식지도·주간업무 합본) — 그 화면을 열 때만 */
function bridgeGet(what, extra) {
  var p = {};
  String(extra || '').replace(/^&/, '').split('&').forEach(function (kv) { if (!kv) return; var i = kv.indexOf('='); p[decodeURIComponent(i < 0 ? kv : kv.slice(0, i))] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1)); });
  var body = { what: what };
  if (p.week !== undefined && isFinite(Number(p.week))) body.week = Number(p.week);
  if (p.doc) body.doc = p.doc;
  if (p.i !== undefined && isFinite(Number(p.i))) body.i = Number(p.i);
  return hubPost('data', body).then(function (j) {
    if (!j || !j.ok) throw new Error((j && (j.error || j.msg)) || '못 받았습니다');
    return j;
  });
}

function myDays() {

  var list = D.tt.byTeacher || [];
  for (var i = 0; i < list.length; i++) if (list[i].name === ME) return list[i];

}

  var t = myDays();
  if (!t) return [];
  var dow = todayDow();
  for (var i = 0; i < t.days.length; i++) {
    if (t.days[i].dow !== dow) continue;
    return (t.days[i].periods || []).map(function (p) { return p; })
      .filter(function (p) { return p; });
  }
  return [];
}

/* ── 줄을 못 찾은 증빙을 줄에 붙이기 ──
   허브가 그 파일을 «학번이름_YYMMDD_(교시)유형_증빙서류» 로 다시 저장하고 옛것은 휴지통으로 보낸다.
   원본이 크면 1600px 로 줄여서 옮긴다 — 원본은 PC 지비스에 그대로 있다. */
function evPickRows() {
  var rows = (ATT && ATT.rows) || [], out = [], seen = {};
  rows.forEach(function (x) {
    var k = evKeyOf(x); if (!k || seen[k + x.type]) return;
    seen[k + x.type] = 1;
    out.push({ k: k, id: String(x.id || ''), name: String(x.name || ''), date: String(x.start || ''), type: String(x.type || ''), reason: String(x.reason || '') });
  });
  return out.sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; }).slice(0, 30);
}
function evPickHtml() {
  var v = EV.view; if (!v || !v.pick) return '';
  var rows = evPickRows();
  if (!rows.length) return '<div class="evmsg">출결 줄을 먼저 받아야 합니다.</div>';
  return '<div class="evpick"><b>이 증빙은 누구 것인가요?</b>'
    + '<div class="evpl">' + rows.map(function (r, i) {
      return '<button type="button" class="evpb" data-evpick="' + i + '"><b>' + esc(r.name) + '</b> <small>' + esc(r.id) + '</small>'
        + '<span>' + esc(attFmtMD(r.date)) + ' · ' + esc(r.type) + '</span></button>';
    }).join('') + '</div>'
    + '<button type="button" class="btn ghost sm" id="evPickX">그만두기</button></div>';
}
function evAssign(i) {
  var v = EV.view; if (!v) return;
  var f = v.files[v.idx], r = evPickRows()[i]; if (!f || !r) return;
  v.pick = false; v.busy = true; v.note = '옮기는 중… 20초쯤 걸릴 수 있습니다'; draw();
  evAsk({ act: 'assign', fid: f.i, id: r.id, name: r.name, date: r.date, type: r.type, reason: r.reason }, 180000).then(function (j) {
    if (!j || !j.ok) throw new Error((j && j.msg) || '옮기지 못했습니다');
    EV.view = null;
    EV.msg = '✓ ' + r.name + ' 줄로 옮겼습니다' + (j.shrunk ? '(사진이 커서 줄여서 옮겼습니다)' : '') + ' · ' + nowHM();
    EV.err = '';
    evLoad(true); evRedraw();
  }).catch(function (e) {
    if (EV.view) { EV.view.busy = false; EV.view.note = ''; EV.view.err = '옮기지 못했습니다 — ' + ((e && e.message) || e); }
    draw();
  });
}

/* ── 보기 창 ── */
function evOpen(key) {
  var l = evFilesOf(key); if (!l.length) return;
  EV.view = { key: key, files: l, idx: 0, busy: false, err: '', zoom: false, note: '' };
  draw(); evFetch();
}
function evOpenList(files, title) {
  if (!files || !files.length) return;
  EV.view = { key: '', files: files, idx: 0, busy: false, err: '', zoom: false, note: '', title: title || '' };
  draw(); evFetch();
}
function evClose() { EV.view = null; draw(); }
function evStep(d) {
  var v = EV.view; if (!v || v.files.length < 2) return;
  v.idx = (v.idx + d + v.files.length) % v.files.length; v.err = ''; v.zoom = false; v.note = '';
  draw(); evFetch();
}
/* 작은 사진은 원본을, 큰 사진은 1600px 미리보기를 받는다. 미리보기를 먼저 보여 주고 원본이 오면 바꿔 끼운다. */
function evFetch() {
  var v = EV.view; if (!v) return;
  var f = v.files[v.idx]; if (!f) return;
  var mem = EVMEM[f.i] || (EVMEM[f.i] = {}), want = f.i, big = f.s > EV_BIG;
  if (mem.full || (big && mem.prev)) { v.busy = false; v.note = big ? ('원본이 커서(' + evSize(f.s) + ') 줄여서 보여 줍니다') : ''; return; }
  var got = function (kind, j) {
    if (!EV.view || EV.view.files[EV.view.idx].i !== want) return;      // 그 사이에 다른 것을 열었다
    var mm = EVMEM[want] || (EVMEM[want] = {});
    if (j && j.ok && j.b64) {
      mm[kind] = 'data:' + (j.mime || 'image/jpeg') + ';base64,' + j.b64;
      EV.view.err = '';
      if (kind === 'prev' && big) EV.view.note = '원본이 커서(' + evSize(f.s) + ') 줄여서 보여 줍니다';
    } else if (!mm.prev && !mm.full) EV.view.err = (j && j.msg) || '증빙을 받지 못했습니다';
    if (kind === 'full' || big) EV.view.busy = false;
    draw();
  };
  v.busy = true; v.err = ''; v.note = '';
  var oops = function (e) {
    if (!EV.view || EV.view.files[EV.view.idx].i !== want) return;
    var mm = EVMEM[want] || {};
    EV.view.busy = false;
    if (!mm.prev && !mm.full) EV.view.err = '증빙을 못 받았습니다 — ' + ((e && e.message) || e) + ' (다시 눌러 보세요)';
    draw();
  };
  if (big || f.s > 400000) evAsk({ act: 'thumb', id: f.i }, 90000).then(function (j) { got('prev', j); }).catch(oops);
  if (!big) evAsk({ act: 'file', id: f.i }, 90000).then(function (j) { got('full', j); }).catch(oops);
}
function evViewHtml() {
  var v = EV.view; if (!v) return '';
  var f = v.files[v.idx] || {}, mem = EVMEM[f.i] || {}, src = mem.full || mem.prev || '';
  var body;
  if (v.err && !src) body = '<div class="evmsg">' + esc(v.err) + '</div>';
  else if (!src) body = '<div class="spin evspin">증빙을 받는 중…' + (f.s > EV_BIG ? '<small>원본이 커서 줄인 그림을 받습니다 · 10초쯤</small>' : '') + '</div>';
  else if (evIsImg(f) || mem.prev) body = '<img class="evimg' + (v.zoom ? ' zoom' : '') + '" alt="' + esc(f.n) + '" src="' + src + '">';
  else {
    body = '<div class="evmsg">이 증빙은 그림이 아닙니다(' + esc(String(f.m || '').split('/').pop().toUpperCase()) + ').<br>아래 «내려받기» 로 열어 보세요.'
      + '<a class="btn sm evdl" download="' + esc(f.n) + '" href="' + src + '">내려받기</a></div>';
  }
  if (v.pick) body = evPickHtml();
  return '<div class="evwrap" id="evWrap" role="dialog" aria-modal="true" aria-label="증빙서류 보기">'
    + '<div class="evbar"><b>' + esc(f.n || '') + '</b>'
    + (v.key ? '<button type="button" class="evb" id="evAdd">＋ 추가</button>' : '<button type="button" class="evb" id="evAssign">줄에 붙이기</button>')
    + '<button type="button" class="evx" id="evClose" aria-label="닫기">✕</button></div>'
    + (v.note ? '<div class="evnote">' + esc(v.note) + '</div>' : '')
    + '<div class="evbody" id="evBody">' + body + '</div>'
    + '<div class="evfoot"><span>' + esc(evSize(f.s)) + (v.files.length > 1 ? ' · ' + (v.idx + 1) + ' / ' + v.files.length : '') + '</span>'
    + (v.files.length > 1 ? '<button type="button" class="btn ghost sm" data-evstep="-1">‹ 이전</button><button type="button" class="btn ghost sm" data-evstep="1">다음 ›</button>' : '')
    + (src && (evIsImg(f) || mem.prev) ? '<button type="button" class="btn ghost sm" id="evZoom">' + (v.zoom ? '화면 맞춤' : '확대') + '</button>' : '')
    + '</div></div>';
}
function evWire() {
  APP.querySelectorAll('[data-evopen]').forEach(function (b) {
    b.addEventListener('click', function (e) { e.stopPropagation(); evOpen(b.dataset.evopen); });
  });
  APP.querySelectorAll('[data-evadd]').forEach(function (b) {
    b.addEventListener('click', function (e) { e.stopPropagation(); EV.msg = ''; EV.err = ''; evPick(b.dataset.evadd); });
  });
  APP.querySelectorAll('[data-evorph]').forEach(function (b) {
    b.addEventListener('click', function (e) { e.stopPropagation(); evOpenList(evOrphan()); });
  });
  var w = $('evWrap');
  if (w) {
    var c = $('evClose'); if (c) c.addEventListener('click', evClose);
    w.addEventListener('click', function (e) { if (e.target === w) evClose(); });
    APP.querySelectorAll('[data-evstep]').forEach(function (b) { b.addEventListener('click', function () { evStep(+b.dataset.evstep); }); });
    var z = $('evZoom'); if (z) z.addEventListener('click', function () { EV.view.zoom = !EV.view.zoom; draw(); });
    var ad = $('evAdd'); if (ad) ad.addEventListener('click', function () { var k = EV.view.key; evClose(); evPick(k); });
    var asg = $('evAssign'); if (asg) asg.addEventListener('click', function () { EV.view.pick = true; EV.view.err = ''; draw(); });
    var px = $('evPickX'); if (px) px.addEventListener('click', function () { EV.view.pick = false; draw(); });
    APP.querySelectorAll('[data-evpick]').forEach(function (b) { b.addEventListener('click', function () { evAssign(+b.dataset.evpick); }); });
  }
  if (!EV.hooked) {
    EV.hooked = true;
    document.addEventListener('keydown', function (e) {
      if (!EV.view) return;
      if (e.key === 'Escape') { e.preventDefault(); evClose(); }
      else if (e.key === 'ArrowLeft') evStep(-1);
      else if (e.key === 'ArrowRight') evStep(1);
    });
    /* 붙여넣기(Ctrl+V) — 증빙 보기 창이 열려 있으면 그 줄에, 아니면 마지막으로 고른 줄에 */
    document.addEventListener('paste', function (e) {
      var k = (EV.view && EV.view.key) || (EV.up && EV.up.key) || '';
      if (!k || VIEW !== 'att') return;
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      var fl = e.clipboardData && e.clipboardData.files;
      if (!fl || !fl.length) return;
      e.preventDefault();
      if (EV.view) evClose();
      evUpload(k, Array.prototype.slice.call(fl));
    });
  }
}

  onI('attDate', function (v) { ATT.form.date = v; });
  onI('attReason', function (v) { ATT.form.reason = v; });
  onI('attTime', function (v) { ATT.form.time = v; });
  onI('attEnd', function (v) { ATT.form.end = v; });
  var ac = $('attCode'), ag = $('attCodeGo');

  if (ag && ac) { ag.addEventListener('click', doCode); ac.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); doCode(); } }); }
  var an = $('attNext'); if (an) an.addEventListener('click', attNext);
  var as = $('attSave'); if (as) as.addEventListener('click', attSave);

  APP.querySelectorAll('[data-attmore]').forEach(function (b) { b.addEventListener('click', function () { ATT.form.more = true; draw(); }); });
  APP.querySelectorAll('[data-attstep]').forEach(function (b) { b.addEventListener('click', function () { ATT.form.step = b.dataset.attstep; ATT.msg = ''; draw(); }); });
  APP.querySelectorAll('[data-attstu]').forEach(function (b) { b.addEventListener('click', function () {

  APP.querySelectorAll('[data-atttype]').forEach(function (b) { b.addEventListener('click', function () {

    draw(); }); });
  APP.querySelectorAll('[data-attp]').forEach(function (b) { b.addEventListener('click', function () {
    var sp = attSplitReason(ATT.form.reason); ATT.form.reason = (sp.pfx === b.dataset.attp ? '' : b.dataset.attp + ' ') + sp.rest; draw(); }); });
  APP.querySelectorAll('[data-attend]').forEach(function (b) { b.addEventListener('click', function () {

  APP.querySelectorAll('[data-attrs]').forEach(function (b) { b.addEventListener('click', function () {
    var x = attReasonChips()[Number(b.dataset.attrs)]; if (x == null) return;
    ATT.form.reason = (attSplitReason(ATT.form.reason).pfx ? attSplitReason(ATT.form.reason).pfx + ' ' : '') + x; draw(); }); });
  APP.querySelectorAll('[data-attphredit]').forEach(function (b) { b.addEventListener('click', function () { ATT.phrEdit = b.dataset.attphredit === '1' ? !ATT.phrEdit : false; ATT.phrJust = false; draw(); }); });
  APP.querySelectorAll('[data-attphrdel]').forEach(function (b) { b.addEventListener('click', function () {
    var l = attReasonChips().slice(); l.splice(Number(b.dataset.attphrdel), 1); attPhrSave(l); draw(); }); });
  APP.querySelectorAll('[data-attphradd]').forEach(function (b) { b.addEventListener('click', function () {
    var el = $('attPhrNew'), v = el ? el.value.trim() : ''; if (!v) return;
    var l = attReasonChips().slice(); if (l.indexOf(v) < 0) l.push(v); attPhrSave(l); draw(); }); });
  var pn = $('attPhrNew'); if (pn) pn.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); var ab = APP.querySelector('[data-attphradd]'); if (ab) ab.click(); } });
  APP.querySelectorAll('[data-attundo]').forEach(function (b) { b.addEventListener('click', attUndo); });
  APP.querySelectorAll('[data-theme]').forEach(function (b) { b.addEventListener('click', function () { setTheme(b.dataset.theme); draw(); }); });
  APP.querySelectorAll('[data-attdelask]').forEach(function (b) { b.addEventListener('click', function () { ATT.delAsk = Number(b.dataset.attdelask); ATT.msg = ''; draw(); }); });
  APP.querySelectorAll('[data-attdelno]').forEach(function (b) { b.addEventListener('click', function () { ATT.delAsk = -1; draw(); }); });
  APP.querySelectorAll('[data-attdelok]').forEach(function (b) { b.addEventListener('click', function () { attDel(Number(b.dataset.attdelok)); }); });
  /* 문자 문구 — 입력칸은 칠 때마다 다시 그리지 않는다(한글 입력이 깨진다) */
  var on = function (sel, fn) { APP.querySelectorAll(sel).forEach(function (b) { b.addEventListener('click', function () { fn(b); }); }); };
  function smsSyncDraft() { var t = $('smsTitle'), d = $('smsDraft'); if (t) SMS.draftTitle = t.value; if (d) SMS.draft = d.value; }
  function smsPv() { var p = $('smsPv'); if (p) p.textContent = smsFill(SMS.draft, smsCurCon()); }
  function smsDirty() { var a = SMS.tpls.filter(function (t) { return t.id === SMS.tag; })[0], el = $('smsDirty'); if (a && el) el.hidden = !(SMS.draft !== a.body || SMS.draftTitle !== a.title); }
  on('[data-smstab]', function (b) { smsSyncDraft(); SMS.tab = b.dataset.smstab; SMS.msg = ''; SMS.confirm = ''; SMS.note = ''; draw(); window.scrollTo(0, 0); });
  on('[data-smstarget]', function (b) { SMS.target = b.dataset.smstarget; SMS.tag = ''; SMS.draftFor = ''; SMS.msg = ''; SMS.note = ''; SMS.confirm = ''; if (SMS.who && smsCurCon()) SMS.num = smsDefNum(smsCurCon()); draw(); });
  on('[data-smstag]', function (b) { SMS.tag = b.dataset.smstag; SMS.draftFor = ''; SMS.msg = ''; SMS.note = ''; SMS.confirm = ''; draw(); });
  on('[data-smsaddtag]', function () {
    var rec = { id: 't' + Date.now().toString(36), title: '새 문구', cat: SMS.target, body: '' };
    SMS.tpls.push(rec); smsSave(); SMS.tag = rec.id; SMS.draftFor = ''; SMS.note = ''; draw();
    var t = $('smsTitle'); if (t) { t.focus(); t.select(); }
  });
  var td = $('smsTitle'); if (td) td.addEventListener('input', function () { SMS.draftTitle = td.value; smsDirty(); });
  var dr = $('smsDraft'); if (dr) dr.addEventListener('input', function () { SMS.draft = dr.value; SMS.note = ''; smsPv(); smsDirty(); });
  on('[data-smsvar]', function (b) {
    var el = $('smsDraft'); if (!el) return;
    var s = el.selectionStart, e = el.selectionEnd, v = b.dataset.smsvar, txt = el.value;
    smsSyncDraft(); SMS.draft = txt.slice(0, s) + v + txt.slice(e); SMS.note = ''; draw();
    var n = $('smsDraft'); if (n) { n.focus(); n.setSelectionRange(s + v.length, s + v.length); }
  });
  var sv = $('smsSaveTpl'); if (sv) sv.addEventListener('click', function () {
    smsSyncDraft();
    if (!SMS.draftTitle.trim()) { SMS.msg = '태그 이름을 적어 주세요'; draw(); return; }
    if (!SMS.draft.trim()) { SMS.msg = '내용을 적어 주세요'; draw(); return; }
    var a = SMS.tpls.filter(function (t) { return t.id === SMS.tag; })[0];
    if (a) { a.title = SMS.draftTitle.trim(); a.body = SMS.draft; smsSave(); SMS.draftFor = ''; SMS.note = '«' + a.title + '» 저장했습니다'; SMS.msg = ''; draw(); }
  });
  var rs = $('smsResetTpl'); if (rs) rs.addEventListener('click', function () { SMS.draftFor = ''; SMS.note = '저장된 내용으로 되돌렸습니다'; SMS.msg = ''; draw(); });
  on('[data-smstdel]', function (b) { smsSyncDraft(); SMS.confirm = 'tdel:' + b.dataset.smstdel; draw(); });
  on('[data-smstdel2]', function (b) { SMS.tpls = SMS.tpls.filter(function (x) { return x.id !== b.dataset.smstdel2; }); smsSave(); SMS.confirm = ''; SMS.tag = ''; SMS.draftFor = ''; SMS.note = ''; draw(); });
  on('[data-smsdelx]', function () { SMS.confirm = ''; draw(); });
  on('[data-smsrs]', function (b) { smsSyncDraft(); SMS.who = b.dataset.smsrs; var c = smsCurCon(); SMS.num = c ? smsDefNum(c) : ''; SMS.msg = ''; draw(); });
  on('[data-smsnum]', function (b) { smsSyncDraft(); SMS.num = b.dataset.smsnum; draw(); });
  var sg = $('smsGo'); if (sg) sg.addEventListener('click', function () { smsSyncDraft(); smsSend(); });
  /* 연락처(시트) */
  on('[data-smsreload]', function () { SMS.consLoaded = false; SMS.consErr = ''; SMS.note = ''; smsLoadCons(true); draw(); });
  on('[data-smsro]', function (b) {
    var s = (SMS.rosterList || []).filter(function (x) { return x.id === b.dataset.smsro; })[0]; if (!s) return;
    var c = SMS.cons[s.id] || {};
    SMS.cedit = { k: s.id, name: s.name, cls: SMS.rosterCls || smsMyCls(), no: s.no, p1: c.p1 || '', p2: c.p2 || '', s: c.s || '', memo: c.memo || '' }; SMS.msg = ''; SMS.note = ''; draw();
  });
  on('[data-smscancel]', function () { SMS.cedit = null; SMS.paste = null; SMS.msg = ''; SMS.confirm = ''; draw(); });
  var cs = $('smsCSave'); if (cs) cs.addEventListener('click', smsCSave);
  on('[data-smscdel]', function (b) {
    if (SMS.confirm === 'cdel:' + b.dataset.smscdel) {
      var e = SMS.cedit; SMS.confirm = '';
      smsConSave([{ id: e.k, name: e.name, p1: '', p2: '', s: '', memo: '' }], function () { SMS.cedit = null; SMS.note = e.name + ' 번호를 시트에서 지웠습니다'; draw(); }); draw();
    } else { SMS.confirm = 'cdel:' + b.dataset.smscdel; draw(); }
  });
  on('[data-smspick]', function (b) {
    var id = b.dataset.smspick;
    try { navigator.contacts.select(['tel'], { multiple: false }).then(function (r) { if (r && r[0] && r[0].tel && r[0].tel[0]) { var el = $(id); if (el) el.value = smsFmtTel(r[0].tel[0]); } }).catch(function () { /* 취소해도 그만 */ }); } catch (e) { /* 지원 안 함 */ }
  });
  on('[data-smspaste]', function () { SMS.paste = { text: '', result: null }; SMS.msg = ''; if (!SMS.rosterList) smsLoadRoster(); draw(); });
  var pt = $('smsPaste'); if (pt) pt.addEventListener('input', function () { SMS.paste.text = pt.value; });
  var pr = $('smsPRead'); if (pr) pr.addEventListener('click', function () {
    SMS.paste.text = (pt ? pt.value : SMS.paste.text);
    if (!SMS.rosterList) { SMS.msg = '우리 반 명단을 아직 못 불러왔습니다 — 잠시 뒤 다시 눌러 주세요'; smsLoadRoster(); draw(); return; }
    SMS.paste.result = smsParsePaste(SMS.paste.text, SMS.rosterList); SMS.msg = ''; draw();
  });
  var pa = $('smsPApply'); if (pa) pa.addEventListener('click', function () {
    var items = (SMS.paste.result.ok || []).map(function (x) { var old = SMS.cons[x.id] || {}; return { id: x.id, name: x.name, p1: x.p1, p2: old.p2 || '', s: x.s || old.s || '', memo: old.memo || '' }; });
    smsConSave(items, function (n) { SMS.paste = null; SMS.note = n + '명의 번호를 시트에 저장했습니다'; draw(); }); draw();

  APP.querySelectorAll('[data-wkdoc]').forEach(function (b) { b.addEventListener('click', function () { WK.doc = b.dataset.wkdoc; LS.set('workdoc', WK.doc); WK.err = ''; draw(); window.scrollTo(0, 0); }); });
  APP.querySelectorAll('[data-wkin]').forEach(function (b) { b.addEventListener('click', function () { WK.ii = Number(b.dataset.wkin); draw(); window.scrollTo(0, 0); }); });
  APP.querySelectorAll('[data-wkmg]').forEach(function (b) { b.addEventListener('click', function () { WK.mi = Number(b.dataset.wkmg); WK.err = ''; draw(); window.scrollTo(0, 0); wkShowOn(); }); });

  APP.querySelectorAll('[data-me]').forEach(function (b) {
    b.addEventListener('click', function () {
      ME = b.dataset.me; LS.set('me', ME); kvSave('me', ME); attReset(); go('tt');

  var q = $('meQ');
  if (q) {
    /* ★ 한글을 넣는 도중에 다시 그리면 글자가 깨진다 — 조합이 끝난 뒤에만 그린다 */
    var composing = false;
    q.addEventListener('compositionstart', function () { composing = true; });
    q.addEventListener('compositionend', function () { composing = false; meQ = q.value; redrawKeep(q); });
    q.addEventListener('input', function () { if (!composing) { meQ = q.value; redrawKeep(q); } });
  }
  var r = $('reload');
  if (r) r.addEventListener('click', function () { load(true); });
  setWire(); navWire(); nmWire(); acWire(); evWire();
}

/* 검색칸만 다시 그리면 커서가 튄다 — 목록만 갈아 끼운다 */
function redrawKeep(q) {
  var box = APP.querySelector('.chips');
  if (!box || !D || !D.tt) return;
  var all = (D.tt.byTeacher || []).map(function (t) { return t.name; })
    .filter(function (n) { return n; });
  var s = meQ.trim();
  var hit = s ? all.filter(function (n) { return n.indexOf(s) >= 0; }) : all;
  box.innerHTML = hit.slice(0, 200).map(function (n) {
    return '<button type="button" class="chip' + (n === ME ? ' on' : '')
      + '" data-me="' + esc(n) + '">' + esc(n) + '</button>';
  }).join('');
  box.querySelectorAll('[data-me]').forEach(function (b) {
    b.addEventListener('click', function () {
      ME = b.dataset.me; LS.set('me', ME); kvSave('me', ME); attReset(); go('tt');
    });
  });
}


/* ══ 서비스워커 — 새 판을 «찾아보고» 스스로 바뀐다 ═══════════ */
(function () {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.register('sw.js').then(function (reg) {
    /* 새 판을 찾아보는 일은 거절될 수 있다(file:// 로 열어 볼 때 등) — 조용히 넘어간다 */
    var up = function () { try { var p = reg.update(); if (p && p.catch) p.catch(function () {}); }
      catch (e) {} };
    up();                                                           // 열자마자
    document.addEventListener('visibilitychange', function () {     // 다시 앞으로 나올 때마다
      if (!document.hidden) up();
    });
    setInterval(up, 30 * 60 * 1000);                                 // 켜 둔 채로도 30분마다
    /* 새 판이 준비되면 통째로 새로고침하기 전에 한 번 알린다 —
       글을 보던 중에 화면이 저 혼자 바뀌면 놀란다 */
    reg.addEventListener('updatefound', function () {
      var sw = reg.installing;
      if (!sw) return;
      sw.addEventListener('statechange', function () {
        if (sw.state === 'installed' && navigator.serviceWorker.controller) {
          $('newver').style.display = 'flex';
        }
      });
    });
  }).catch(function () { /* file:// 로 열어 볼 때는 등록이 안 된다 — 화면은 멀쩡히 돈다 */ });
  var refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (refreshing) return; refreshing = true; location.reload();
  });
  $('nvBtn').addEventListener('click', function () { location.reload(); });
})();


/* ══ 시작 ═══════════════════════════════════════════════ */
(function () {
  var fromHash = pairFromHash();
  if (fromHash || !HUB.key) { VIEW = 'pair'; draw(); return; }      // 연결 링크로 열었거나 아직 연결 전
  var c = LS.get('cache', '');
  if (c) { try { D = JSON.parse(c); } catch (e) { /* */ } }          // 먼저 지난 것을 — 단, 잠금이 풀린 뒤에만 보인다
  VIEW = 'home'; histReset();
  if (!lockStart()) { draw(); load(); kvPull(); }
  /* 앱을 다시 앞으로 꺼낼 때 자료도 같이 새로 받는다 (잠겨 있으면 풀린 뒤에) */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && HUB.key && !LOADING && !LOCK.flow) load();
  });
})();
